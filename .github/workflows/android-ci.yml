name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs (dialer + receiver, debug & release signé)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (cache inclus)
        uses: gradle/actions/setup-gradle@v4

      - name: Permission d'exécution pour gradlew
        run: chmod +x gradlew

      # Racine = assembleDebug/assembleRelease de TOUS les modules Android :
      # :app (Ever Dialer+, téléphone A) et :receiver (Ever Call Recording, téléphone B).
      - name: Assemble debug + release (tous modules)
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Upload APK dialer debug (:app)
        uses: actions/upload-artifact@v4
        with:
          name: ever-dialer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APK dialer release signé (:app)
        uses: actions/upload-artifact@v4
        with:
          name: ever-dialer-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload APK receiver debug (:receiver)
        uses: actions/upload-artifact@v4
        with:
          name: ever-call-recording-debug
          path: receiver/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APK receiver release signé (:receiver)
        uses: actions/upload-artifact@v4
        with:
          name: ever-call-recording-release-signed
          path: receiver/build/outputs/apk/release/*.apk
          if-no-files-found: error

name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs (debug + release signé)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (cache inclus)
        uses: gradle/actions/setup-gradle@v4

      - name: Permission d'exécution pour gradlew
        run: chmod +x gradlew

      - name: Assemble debug + release
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: ever-dialer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APK release (signé avec le keystore du repo)
        uses: actions/upload-artifact@v4
        with:
          name: ever-dialer-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

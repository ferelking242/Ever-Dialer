name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs — Ever Dialer+ (A) + Ever Call Recording (B)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (cache inclus)
        uses: gradle/actions/setup-gradle@v4

      - name: Permission d'exécution pour gradlew
        run: chmod +x gradlew

      # Racine = assembleDebug/assembleRelease de TOUS les modules Android :
      # :app (Ever Dialer+, téléphone A) et :receiver (Ever Call Recording, téléphone B).
      - name: Assemble debug + release (tous modules)
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      # ── Téléphone A : Ever Dialer+ (dialer + enregistreur + Shizuku + sync sender) ──
      - name: APK Téléphone A — debug
        uses: actions/upload-artifact@v4
        with:
          name: Ever-Dialer-+-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: APK Téléphone A — release signé
        uses: actions/upload-artifact@v4
        with:
          name: Ever-Dialer-+-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ── Téléphone B : Ever Call Recording (receiver P2P, reçoit les enregistrements) ──
      - name: APK Téléphone B — debug
        uses: actions/upload-artifact@v4
        with:
          name: Ever-Call-Recording-debug
          path: receiver/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: APK Téléphone B — release signé
        uses: actions/upload-artifact@v4
        with:
          name: Ever-Call-Recording-release-signed
          path: receiver/build/outputs/apk/release/*.apk
          if-no-files-found: error
